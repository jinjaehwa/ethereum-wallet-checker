
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereum Wallet Checker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header>
            <h1>Ethereum Wallet Checker</h1>
            <p>이더리움 지갑 주소를 입력하여 잔액과 블록 정보를 조회합니다.</p>
        </header>

        <section class="search-box">
            <label for="wallet-address">지갑 주소</label>

            <div class="input-group">
                <input
                    type="text"
                    id="wallet-address"
                    placeholder="0x로 시작하는 지갑 주소"
                    autocomplete="off"
                    spellcheck="false"
                >
                <button id="search-button" type="button">조회</button>
            </div>
        </section>

        <p id="status" role="status" aria-live="polite"></p>

        <section class="result-box">
            <div class="result-item">
                <span>ETH 잔액</span>
                <strong id="balance">-</strong>
            </div>

            <div class="result-item">
                <span>현재 블록 번호</span>
                <strong id="block-number">-</strong>
            </div>
        </section>
    </main>
</body>
</html>
